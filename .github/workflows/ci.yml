name: CI

on:
  push:
    branches: [main, platform]
  pull_request:
    branches: [main, platform]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Установить зависимости
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Проверить миграции
        env:
          DATABASE_URL: sqlite:///./data/ci-migrations.db
        run: |
          rm -f data/ci-migrations.db
          alembic upgrade head
      - name: Тесты
        env:
          DATABASE_URL: sqlite:///./data/ci-tests.db
          SEED_DEMO: "true"
          SMS_PROVIDER: console
          SMS_EXPOSE_CODE: "true"
          DEBUG: "true"
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Установить зависимости
        run: npm ci
      - name: Проверить типы
        run: npx tsc --noEmit
      - name: Собрать
        run: npm run build
